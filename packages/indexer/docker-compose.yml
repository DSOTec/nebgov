version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nebgov
      POSTGRES_PASSWORD: nebgov
      POSTGRES_DB: nebgov
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebgov"]
      interval: 5s
      timeout: 5s
      retries: 5

  indexer:
    build: .
    environment:
      DATABASE_URL: postgres://nebgov:nebgov@postgres:5432/nebgov
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      STELLAR_NETWORK_PASSPHRASE: "${STELLAR_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}"
      GOVERNOR_ADDRESS: ${GOVERNOR_ADDRESS:-}
      WRAPPER_ADDRESS: ${WRAPPER_ADDRESS:-}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:-}
      TREASURY_SIMULATION_ACCOUNT: ${TREASURY_SIMULATION_ACCOUNT:-}
      LIQUIDITY_ADDRESS: ${LIQUIDITY_ADDRESS:-}
      CO_SPONSORSHIP_ADDRESS: ${CO_SPONSORSHIP_ADDRESS:-}
      TIMELOCK_ADDRESS: ${TIMELOCK_ADDRESS:-}
      TOKEN_VOTES_ADDRESS: ${TOKEN_VOTES_ADDRESS:-}
      POLL_INTERVAL_MS: 5000
      PORT: 3001
      HEALTH_LAG_THRESHOLD: ${HEALTH_LAG_THRESHOLD:-100}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
