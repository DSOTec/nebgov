name: Governance Simulation

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "tools/sim/**"
      - ".github/workflows/simulation.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "tools/sim/**"
      - ".github/workflows/simulation.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  simulate:
    name: Run scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/sim/target
          key: ${{ runner.os }}-cargo-sim-${{ hashFiles('tools/sim/Cargo.lock', 'Cargo.lock') }}

      - name: Run all scenarios
        run: cargo run --manifest-path tools/sim/Cargo.toml -- run-all

      - name: Upload simulation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-reports
          path: tools/sim/reports/

      - name: Check for compute budget warnings
        if: always()
        run: |
          shopt -s nullglob
          reports=(tools/sim/reports/*.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "ERROR: no simulation reports found"
            exit 1
          fi
          python3 scripts/check_budget_warnings.py "${reports[@]}"
